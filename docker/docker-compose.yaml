services:
  lotus:
    container_name: lotus
    deploy:
      resources:
        reservations:
          memory: 8G
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ['0']
    image: denden047/lotus
    build:
      args:
        - BASE_IMAGE=nvidia/cuda:12.1.0-devel-ubuntu20.04
        - PYTHON_VERSION=3.10
        - FORCE_CUDA=1
        - UID=1001
        - GID=1001
        - USER_NAME=naoya
        - GROUP_NAME=naoya
        - TORCH_CUDA_ARCH_LIST=7.5;8.6;8.9
      context: ./
      dockerfile: Dockerfile
    tty: true
    volumes:
      - ../:/home/naoya/project
      - /data/naoya/WildPose-DenseDepth:/data/
    # ports:
    #   - 8000:8000